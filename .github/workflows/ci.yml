name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.8.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Cache vcpkg OpenSSL
        uses: actions/cache@v4
        with:
          path: C:\vcpkg\installed
          key: vcpkg-openssl-x64-windows-static-v1

      - name: Install OpenSSL via vcpkg
        shell: pwsh
        run: |
          $env:VCPKG_ROOT = "C:\vcpkg"
          if (-not (Test-Path "$env:VCPKG_ROOT\.git")) {
            git clone --depth 1 https://github.com/microsoft/vcpkg "$env:VCPKG_ROOT"
            & "$env:VCPKG_ROOT\bootstrap-vcpkg.bat"
          }
          if (-not (Test-Path "$env:VCPKG_ROOT\installed\x64-windows-static\lib\libssl.lib")) {
            & "$env:VCPKG_ROOT\vcpkg.exe" install openssl:x64-windows-static
          }

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm build

      - name: Run Rust tests
        shell: pwsh
        env:
          VCPKG_ROOT: C:\vcpkg
          OPENSSL_DIR: C:\vcpkg\installed\x64-windows-static
          OPENSSL_LIB_DIR: C:\vcpkg\installed\x64-windows-static\lib
          OPENSSL_INCLUDE_DIR: C:\vcpkg\installed\x64-windows-static\include
          OPENSSL_STATIC: "1"
          OPENSSL_NO_VENDOR: "1"
        run: |
          $env:INCLUDE = "$($env:OPENSSL_INCLUDE_DIR);$($env:INCLUDE)"
          cargo test --manifest-path src-tauri/Cargo.toml
